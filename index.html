/* Layout: one-screen app. Phone: header + day chips on top, map in the middle, the day's stops as a sheet below.
   Desktop: stops column on the right (RTL start), map fills the rest. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17232b; --muted:#5c6b76; --line:#dde3e8;
  --accent:#0b6e8c; --accent-fg:#ffffff; --chip:#e7edf1; --shadow:0 6px 24px rgba(23,35,43,.12);
  --d1:#0e8f8f; --d2:#c2357b; --d3:#d98a1a; --d4:#6a4fc4; --d5:#5c6b7a; --d6:#8a7a5a;
  --font-body:'Heebo','Assistant',Arial,sans-serif; --font-display:'Frank Ruhl Libre','Heebo',Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#1a232a; --fg:#eef2f5; --muted:#9fb0bb; --line:#2c3942; --accent:#4fb3d2; --accent-fg:#0b1418;
  --chip:#243039; --shadow:0 6px 24px rgba(0,0,0,.4); --d1:#2fbdbd; --d2:#ec5fa3; --d3:#f0a53a; --d4:#9b85e6; --d5:#9aa9b6; --d6:#b8a37c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#1a232a; --fg:#eef2f5; --muted:#9fb0bb; --line:#2c3942; --accent:#4fb3d2; --accent-fg:#0b1418;
  --chip:#243039; --shadow:0 6px 24px rgba(0,0,0,.4); --d1:#2fbdbd; --d2:#ec5fa3; --d3:#f0a53a; --d4:#9b85e6; --d5:#9aa9b6; --d6:#b8a37c; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);direction:rtl;text-align:right;overscroll-behavior:none}
*{box-sizing:border-box}
#app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) minmax(0,1fr);grid-template-areas:"head" "chips" "map" "list"}
@media (min-width:860px){#app{grid-template-columns:400px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"head head" "chips map" "list map"}}
header{grid-area:head;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px 6px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-family:var(--font-display);font-weight:900;font-size:1.45rem;margin:0;letter-spacing:-.01em}
header .dates{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
nav.chips{grid-area:chips;display:flex;gap:6px;padding:8px 16px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
nav.chips::-webkit-scrollbar{display:none}
nav.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:inherit;font-weight:500;font-size:.9rem;padding:6px 12px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
nav.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
nav.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:absolute;inset:0;background:var(--chip);z-index:0}
#list{grid-area:list;min-height:0;overflow-y:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.dayhead{margin:0 0 10px}
.dayhead h2{margin:0;font-size:1.05rem;font-weight:800}
.dayhead .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.dayhead .wx{color:var(--muted);font-size:.82rem;margin-top:4px}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.stop:hover,.stop:focus-within{border-color:var(--accent)}
.stop.active{box-shadow:0 0 0 2px var(--accent) inset}
.stop .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;align-self:start}

const DAYS = [{"n": 0, "chip": "הכל", "label": "כל הטיול", "sub": "50 נקודות, 5 ימים", "weather": ""}, {"n": 1, "chip": "ג׳ 6.10", "label": "שלישי 6.10", "sub": "מהמטוס למגלשות", "weather": "שמשי וחמים, 23 עד 24 מעלות ביום, 10 בלילה"}, {"n": 2, "chip": "ד׳ 7.10", "label": "רביעי 7.10", "sub": "מעבר לעיר, השופינג הגדול ובר הגג", "weather": "שמשי וחמים, 23 עד 24 מעלות ביום, 10 בלילה"}, {"n": 3, "chip": "ה׳ 8.10", "label": "חמישי 8.10", "sub": "בודה האייקונית, קיי-פופ והשופינג הגדול בפריימרק", "weather": "מעונן, 15 עד 22 מעלות. סיכוי לטפטוף בין 12:00 ל-15:00, מטרייה קטנה בתיק"}, {"n": 4, "chip": "ו׳ 9.10", "label": "שישי 9.10", "sub": "מדבקות מעצבים, חלופות קלילות ושקיעה מהסרטים", "weather": "מתקרר: 15 עד 17 ביום, 7 בלילה. שכבות, מעיל ונעליים סגורות"}, {"n": 5, "chip": "ש׳ 10.10", "label": "שבת 10.10", "sub": "הביתה, עוקפים את המרתון", "weather": "קריר, 15 עד 17 ביום. יציאה מוקדמת מאוד, הכבישים נחסמים ב-09:00"}, {"n": 6, "chip": "עוד", "label": "עוד חנויות שוות", "sub": "חלופות לעצירה קצרה בדרך", "weather": ""}];
const DC = {0:'var(--d5)',1:'var(--d1)',2:'var(--d2)',3:'var(--d3)',4:'var(--d4)',5:'var(--d5)',6:'var(--d6)'};
// "עוד" chip (n=6) shows the extras stored as day 0 in the data
const dayOf = p => p.day === 0 ? 6 : p.day;
const HOTEL = PLACES.find(p => p.id === 'hotel');

const navUrl = p => `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=${p.mode}`;
const infoUrl = p => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.q)}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// map
const map = L.map('map', {zoomControl:false, attributionControl:true});
L.control.zoom({position:'bottomleft'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

let cur = 0, markers = [], line = null, activeId = null;
const chips = document.getElementById('chips');
const list = document.getElementById('list');

function numbering(day){ // stop numbers within a day, document order; optional stops still numbered
  const ps = PLACES.filter(p => dayOf(p) === day);
  return new Map(ps.map((p,i) => [p.id, i+1]));
}
const NUMS = {}; for (let d=1; d<=6; d++) NUMS[d] = numbering(d);

function pinIcon(p){
  const d = dayOf(p), n = NUMS[d].get(p.id);
  return L.divIcon({className:'', iconSize:[28,28], iconAnchor:[0,28], popupAnchor:[14,-26],
    html:`<div class="pin ${p.optional?'optional':''}" style="background:${DC[d]};--dc:${DC[d]}"><span>${n}</span></div>`});
}
function popupHtml(p){
  return `<div class="pt">${esc(p.name)}${p.time?` <span style="color:var(--muted);font-weight:500">${p.time}</span>`:''}</div>
  <div class="pn">${esc(p.note)}</div>
  <div class="acts"><a class="btn primary" target="_blank" rel="noopener" href="${navUrl(p)}">נווט</a>
  <a class="btn" target="_blank" rel="noopener" href="${infoUrl(p)}">פרטים בגוגל</a></div>`;
}

function render(day){
  cur = day;
  try{ localStorage.setItem('bp-day', String(day)); }catch(e){}
  for (const b of chips.children) b.setAttribute('aria-pressed', String(+b.dataset.day === day));
  markers.forEach(m => m.remove()); markers = [];
  if (line){ line.remove(); line = null; }
  const ps = PLACES.filter(p => day === 0 ? true : dayOf(p) === day);
  for (const p of ps){
    const m = L.marker([p.lat, p.lon], {icon:pinIcon(p), title:p.name}).addTo(map).bindPopup(popupHtml(p));
    m.on('click', () => highlight(p.id, false));
    m._pid = p.id; markers.push(m);
  }
  if (day >= 1 && day <= 5){
    const pts = ps.filter(p => !p.optional).map(p => [p.lat, p.lon]);
    if (pts.length > 1) line = L.polyline(pts, {color:DC[day].startsWith('var') ? getComputedStyle(document.documentElement).getPropertyValue(DC[day].slice(4,-1)).trim() : DC[day], weight:3, dashArray:'6 8', opacity:.7}).addTo(map);
  }
  if (ps.length){
    const b = L.latLngBounds(ps.map(p => [p.lat, p.lon]));
    map.fitBounds(b, {padding:[36,36], maxZoom: day===0 ? 12 : 16});
  }
  // list
  const D = DAYS.find(x => x.n === day);
  let h = `<div class="dayhead"><h2>${esc(D.label)}</h2><div class="sub">${esc(D.sub)}</div>${D.weather?`<div class="wx">${esc(D.weather)}</div>`:''}</div>`;
  if (day === 0){
    h += `<div class="legend">${DAYS.filter(x=>x.n>=1).map(x=>`<span style="--dc:${DC[x.n]}">${esc(x.chip)}</span>`).join('')}</div>`;
  }
  h += ps.map(p => {
    const d = dayOf(p), n = NUMS[d].get(p.id);
    return `<article class="stop ${p.optional?'optional':''}" data-id="${p.id}" tabindex="0" style="--dc:${DC[d]}">
      <div class="num" style="background:${DC[d]}">${n}</div>
      <div style="min-width:0">
        <div><span class="t">${esc(p.name)}</span>${p.time?`<span class="time">${p.time}</span>`:''}${day===0?`<span class="time">${esc(DAYS.find(x=>x.n===d).chip)}</span>`:''}</div>
        <div class="note">${esc(p.note)}</div>
        <div class="addr">${esc(p.addr)}</div>
        <div class="acts"><a class="btn primary" target="_blank" rel="noopener" href="${navUrl(p)}">נווט</a>
        <a class="btn" target="_blank" rel="noopener" href="${infoUrl(p)}">פרטים בגוגל</a></div>
      </div></article>`;
  }).join('');
  h += `<footer>לחיצה על נקודה ברשימה מקפיצה את המפה אליה. "נווט" פותח את Google Maps עם היעד מוכן. מבוסס על המסמך "בודפשט שלנו", עודכן 8.10.2026.</footer>`;
  list.innerHTML = h;
  list.scrollTop = 0;
  list.querySelectorAll('.stop').forEach(el => {
    el.addEventListener('click', e => { if (e.target.closest('a')) return; highlight(el.dataset.id, true); });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') highlight(el.dataset.id, true); });
  });
}
function highlight(id, fly){
  activeId = id;
  list.querySelectorAll('.stop').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  const m = markers.find(x => x._pid === id); const p = PLACES.find(x => x.id === id);
  if (!m || !p) return;
  if (fly){ map.flyTo([p.lat, p.lon], Math.max(map.getZoom(), 16), {duration:.6}); setTimeout(() => m.openPopup(), 650); }
}
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; setTimeout(() => t.hidden = true, 2600); }

// chips
for (const D of DAYS){
  const b = document.createElement('button'); b.textContent = D.chip; b.dataset.day = D.n; b.setAttribute('aria-pressed','false');
  b.addEventListener('click', () => render(D.n)); chips.appendChild(b);
}
document.getElementById('btnHotel').addEventListener('click', () => {
  if (cur !== 0 && cur !== 2) render(0);
  highlight('hotel', true);
});
let meMarker = null;
document.getElementById('btnMe').addEventListener('click', () => {
  if (!navigator.geolocation) return toast('אין גישה למיקום בדפדפן הזה');
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (meMarker) meMarker.remove();
    meMarker = L.circleMarker(ll, {radius:8, color:'#fff', weight:2, fillColor:'#1a73e8', fillOpacity:1}).addTo(map).bindPopup('אתם כאן');
    map.flyTo(ll, 16);
  }, () => toast('לא הצלחתי לקבל מיקום. בדקו הרשאת מיקום לדפדפן'));
});

// default day: the trip day if we are inside the trip, otherwise the last chosen, otherwise "הכל"
(function(){
  const now = new Date(); let d = 0;
  if (now.getFullYear() === 2026 && now.getMonth() === 9 && now.getDate() >= 6 && now.getDate() <= 10) d = now.getDate() - 5;
  else { try{ const s = localStorage.getItem('bp-day'); if (s !== null) d = +s; }catch(e){} }
  render(d);
})();
window.addEventListener('resize', () => map.invalidateSize());
</script>
